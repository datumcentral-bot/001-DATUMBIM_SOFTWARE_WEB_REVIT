[project]
name = "datumbim-revit-connector"
version = "0.1.0"
description = "DATUMBIM Revit Connector — real Revit API, pyRevit, Dynamo integration"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "psutil>=5.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
